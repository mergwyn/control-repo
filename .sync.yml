---
common:
  disable_legacy_facts: true
  owner: mergwyn
  honeycomb:
    enabled: false

appveyor.yml:
  delete: true
.gitlab-ci.yml:
  delete: true
.gitignore:
  required: &ignorepaths
    - ".onceover/"
    - "spec/fixtures"
    - ".fixtures.yml"
    - "pdk.yaml"
.travis.yml:
  delete: true
#.travis.yml:
#  cache:
#    bundler: true
#  branches:
#  - production
#  - /^dev/
#  notifications:
#    email:
#      on_success: change # default: change
#      on_failure: always # default: always

Gemfile:
  required:
    ":development":
      #      - gem: rake
      #      - gem: r10k
      #      - gem: ra10ke
      - gem: onceover
      - gem: hiera-eyaml
      #      - gem: CFPropertyList
      - gem: rspec-puppet-utils
      - gem: github_changelog_generator
  optional:
    ":development":
      - gem: "generate-puppetfile"
        version: "~> 1.0"
  overrides:
    - gem: puppetlabs_spec_helper
      version: '~> 7.4'
#  overrides:
#    - gem: facterdb
#      version: '~> 3.4'

spec/spec_helper.rb:
  coverage_report: true
  minimum_code_coverage_percentage: 0
  strict_level: ":warning"
  hiera_config: "spec/hiera.yaml"
  mock_with: ":rspec"

spec_overrides:
  facts:
    facter_version: "4.5.2"

Rakefile:
  requires:
    - "r10k/puppetfile"
    - "yaml"
  linter_fail_on_warnings: false
  extra_disabled_lint_checks:
    - strict_indent
    - parameter_documentation
    - parameter_order
    - parameter_types
    - params_empty_string_assignment
    - lookup_in_parameter
  extras:
    #  - require 'ra10ke'
    #  - Ra10ke::RakeTask.new
    - require 'onceover/rake_tasks'
    - FastGettext.default_text_domain = 'default-text-domain'
    - Rake.add_rakelib 'rakelib'

.github/workflows/nightly.yml:
  unmanaged: true
.github/workflows/pr_test.yml:
  unmanaged: true
.github/workflows/auto_release.yml:
  unmanaged: true
.github/workflows/spec.yml:
  unmanaged: true
  checks: "validate lint check rubocop"
.github/workflows/release.yml:
  unmanaged: true
