---
classes:
  - profile::platform::baseline::debian::boot

# puppet agent
puppet::puppet_server: "echo.%{trusted.domain}"
puppet::manage_repos: false
puppet::structured_facts: true

# TODO turn backuppc::client::scripts into common settings
profile::app::backuppc::client::scripts: "/etc/backuppc-scripts"
profile::app::backuppc::client::preuser: "%{lookup('profile::app::backuppc::client::scripts')}/DumpPreUser"
profile::app::backuppc::client::postuser: "%{lookup('profile::app::backuppc::client::scripts')}/DumpPostUser"

profile::app::kopia::client::scripts: "/etc/kopia"
profile::app::kopia::client::snapafter: "%{lookup('profile::app::kopia::client::scripts')}/snap-after"
profile::app::kopia::client::snapbefore: "%{lookup('profile::app::kopia::client::scripts')}/snap-before"
#
# set nginx package
nginx::package_name: "nginx-extras"
nginx::server_purge: true

samba::params::sernetpkgs: false
samba::classic::domain: "%{lookup('defaults::workgroup')}"
samba::classic::realm: "%{lookup('defaults::realm')}"

# backuppc client
profile::app::backuppc::client::backuppc_hostname: "foxtrot.%{trusted.domain}"
profile::app::backuppc::client::backup_files_exclude:

profile::app::kopia::repos:
  - minio-kopia
  - idrive-kopia
profile::app::kopia::snaps:
  - /boot
  - /etc
  - /root
  - /home
  - /opt
  - /usr/local
  - /var/spool/cron
  - /var/backups

# kopia client
profile::app::kopia::common_excludes:
  - '.git/'
  - '.zfs'
  -  '$RECYCLE.BIN'
  - '.AppleDouble'
  - '.bash_history'
  - '.bundle/'
  - '.cache/'
  - 'exclude'
  - '.fsck'
  - '.gdfuse'
  - '.gem'
  - '.journal'
  - '.kube/cache'
  - '*.ldb'
  - 'nobackup'
  - '**/cache'
  - '.recycle'
  - '*.vdi'
  - '*.vmdk'
  - 'zero'
  - '**/.unison/ar*'
  - '**/.unison/fp*'
  - '**/.unison/unison.log'
  - 'urandom'
  - '.npm/'
  - '*.original'
  - '.osync_workdir'
  - '*.ova'
  - '*.pbd'
  - '*Recycle Bin*'
  - '**/.ssh/ctl'
  - '**/Virtual Machines.localized'
  - '*.tar'
  - '.TemporaryItems/'
  - '.Trash/'
  - '*/trashbox*'
  - '.Trashes'

profile::app::kopia::backup_files_exclude:
  "/opt":
    - "puppetlabs/puppet/cache"
    - "puppetlabs/puppet/pdk/share/cache"
    - "puppetlabs/puppet/public/last_run_summary.yaml"
    - "puppetlabs/server/data/puppetserver/reports"
  "/home":
    - "**/VirtualBox VMs/"
    - "**/Library/Caches/"
    - "**/Library*/Mail/Caches/"
    - "**/Library*/Mail/V3/"
    - "**/.working"
    - "**/.cache"
    - "**/.local/lib/"
    - "*/lost+found*"
    - "**/media/.config/Radarr/logs*"
    - "**/Music/iTunes/Album Artwork/"
    - "**/Music/iTunes/iTunes Media/Automatically*/"
    - "**/Music/Music/Previous Libraries*/"
