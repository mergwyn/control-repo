---


profile::platform::baseline::files::defaults:
  ensure:                           present
profile::platform::baseline::files::objects:
  /usr/local/lib/vim:
    ensure:                         directory
  /usr/local/lib/vim/vimrc.local:
    source:                         'puppet:///modules/profile/vimrc.local'

profile::platform::baseline::packages::defaults:
  ensure: present
  provider: homebrew
profile::platform::baseline::packages::objects:
  whatsapp: {}
  firefox: {}
  vlc: {}
  # sonos: {}
  plex: {}
  monitorcontrol: {}

profile::platform::baseline::darwin::loginwindow::text: "%{facts.networking.hostname}"

profile::platform::baseline::darwin::timemachine::host: "delta.${trusted['domain']}"
profile::platform::baseline::darwin::timemachine::share: timemachine
profile::platform::baseline::darwin::timemachine::user: timemachine
profile::platform::baseline::darwin::timemachine::password: "%{lookup('secrets::timemachine')}"
profile::platform::baseline::darwin::timemachine::exclusions: [
  "/Users/Shared/Virtual Machines/",
  "/Users/Shared/Amazon Photos Downloads",
  "~gary/odrive/",
]

profile::platform::baseline::darwin::activedirectory::admin_user: "%{lookup('secrets::domain_user')}"
profile::platform::baseline::darwin::activedirectory::admin_password: "%{lookup('secrets::domain_password')}"
profile::platform::baseline::darwin::activedirectory::admin_group_list: [
  'THECLARKHOME\Administrators',
  'THECLARKHOME\Domain Admins',
  'THECLARKHOME\Enterprise Admins',
]
