---


profile::platform::baseline::files::defaults:
  ensure:                           present
profile::platform::baseline::files::objects:
  /usr/local/lib/vim:
    ensure:                         directory
  /usr/local/lib/vim/vimrc.local:
    source:                         'puppet:///modules/profile/vimrc.local'

profile::platform::baseline::packages::defaults:
  ensure: present
  provider: homebrew
profile::platform::baseline::packages::objects:
  whatsapp: {}
  firefox: {}
  vlc: {}
  # sonos: {}
  plex: {}
  monitorcontrol: {}

profile::platform::baseline::darwin::loginwindow::loginwindow_text: "%{facts.networking.hostname}"

profile::platform::baseline::darwin::timemachine::tm_host: delta.local
profile::platform::baseline::darwin::timemachine::tm_share: timemachine
profile::platform::baseline::darwin::timemachine::::tm_user: backup
profile::platform::baseline::darwin::timemachine::tm_password: "%{lookup('secrets:backup')}"
profile::platform::baseline::darwin::timemachine::tm_exclusions: [
  "/Users/Shared/Virtual Machines/",
  "/Users/Shared/Amazon Photos Downloads",
  "~gary/odrive/",
]

profile::platform::baseline::darwin::activedirectory::ad_admin_user: administrator
profile::platform::baseline::darwin::activedirectory::ad_admin_password: "%{lookup('secrets:domain')}"
profile::platform::baseline::darwin::activedirectory::domain_admin_group_list: [
  'THECLARKHOME\Administrators',
  'THECLARKHOME\Domain Admins',
  'THECLARKHOME\Enterprise Admins',
]
