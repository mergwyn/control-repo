---
classes:
  - profile::platform::baseline::debian::netplan

packages:
  - bridge-utils

profile::platform::baseline::debian::mounts::defaults:
  ensure: "mounted"
profile::platform::baseline::debian::mounts::objects:
  longhorn:
    name: '/var/lib/longhorn-sda'
    device: 'UUID=0bd12f5a-be2c-4b6e-be18-8f21ac9b0337'
    fstype: 'ext4'
    options: 'defaults'

node::ip: "%{lookup('defaults::subnet')}.13"
node::interface: "eno1"

profile::platform::baseline::debian::netplan::ethernets:
 "%{lookup('node::interface')}":
    dhcp4: no
    mtu: 9000
profile::platform::baseline::debian::netplan::bridges:
  br0:
    interfaces:
      - "%{lookup('node::interface')}"
    mtu: 9000
    dhcp4: no
    dhcp6: no
    addresses:
      - "%{lookup('node::ip')}/%{lookup('defaults::bits')}"
    #link-local: [ ipv4 ]
    routes:
      - to: "0.0.0.0/0"
        via: "%{lookup('defaults::gateway')}"
      - to: 224.0.0.0/4
        scope: link
    nameservers:
      search: "%{alias('defaults::dns::search')}"
      addresses: "%{alias('defaults::dns::nameservers')}"
    parameters:
      stp: false
      forward_delay: 0

# The nvme drive has potential issues with power management, so we disable it
# to avoid starting and stopping the drive too
profile::platform::baseline::debian::boot::zfsbootmenu::kernel_cmdline_extra:
  "nvme_core.default_ps_max_latency_us=0"

# Config for lxd server
lxd::preseed:
  storage_pools:
    - config:
        source: rpool/lxd
        volatile.initial_source: rpool/lxd
        zfs.pool_name: rpool/lxd
      description: ""
      name: default
      driver: zfs

profile::app::kopia::maintenance: false

profile::platform::baseline::debian::zfs::snapshotter::settings:
  rpool/zfspv:
    snap: "no"
  rpool/srv:
    snap: "yes"
