---

classes:
  - profile::platform::baseline::debian::netplan
  - kmod

# e1000 hangs
kmod::list_of_options:
  'e1000e_throttlerate':
     module: e1000e
     option: InterruptThrottleRate
     value: 1
     notify: 'Exec[update_initramfs_all]'
  'e1000e_use_workqueue':
     module: e1000e
     option: use_workqueue
     value: 1
     notify: 'Exec[update_initramfs_all]'

packages:
  - bridge-utils

profile::platform::baseline::debian::netplan::ethernets:
  eno1:
    dhcp4: no
    mtu: 9000
profile::platform::baseline::debian::netplan::bridges:
  br0:
    interfaces:
      - eno1
    mtu: 9000
    dhcp4: no
    dhcp6: no
    addresses:
      - "%{lookup('defaults::subnet')}.13/%{lookup('defaults::bits')}"
    #link-local: [ ipv4 ]
    routes:
      - to: "0.0.0.0/0"
        via: "%{lookup('defaults::gateway')}"
      - to: 224.0.0.0/4
        scope: link
    nameservers:
      # search: "%{alias('defaults::dns::search')}"
      addresses: "%{alias('defaults::dns::nameservers')}"
    parameters:
      stp: false
      forward_delay: 0

# Config for lxd server
lxd::preseed:
  storage_pools:
  - config:
      source: rpool/lxd
      volatile.initial_source: rpool/lxd
      zfs.pool_name: rpool/lxd
    description: ""
    name: default
    driver: zfs

profile::app::kopia::maintenance: false

profile::platform::baseline::debian::zfs::snapshotter::settings:
  rpool/zfspv:
    snap: "no"
  rpool/srv:
    snap: "yes"

# kopia client
profile::app::kopia::backup_files_exclude:
  '/':
    - '/var/lib/rancher/k3s/agent/containerd'
    - '/run/k3s/containerd'
    - '/srv/media'
