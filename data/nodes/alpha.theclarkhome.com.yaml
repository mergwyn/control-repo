---
classes:
  - profile::platform::baseline::debian::netplan

profile::app::dhcpd::role: secondary
profile::app::dhcpd::peer_address: "%{lookup('defaults::dns::nameservers.1')}"

node::ip: "%{lookup('defaults::dns::nameservers.0')}"
node::interface: "eth0"

profile::platform::baseline::debian::netplan::ethernets:
 "%{lookup('node::interface')}":
    dhcp4: no
    addresses:
      - "%{lookup('node::ip')}/%{lookup('defaults::bits')}"
    routes:
      - to: default
        via: "%{lookup('defaults::gateway')}"
    nameservers:
      search: "%{alias('defaults::dns::search')}"
      addresses:
      - "%{lookup('defaults::dns::nameservers.1')}"
      - "%{lookup('defaults::dns::nameservers.0')}"
