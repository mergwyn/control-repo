---
classes:
  - profile::platform::baseline::debian::netplan
  - profile::platform::baseline::debian::ssh::zbm_recovery

profile::platform::baseline::debian::boot::zfsbootmenu::remote_access::enable: true

node::ip: "%{lookup('defaults::subnet')}.11"
node::interface: "enp2s0"
profile::platform::baseline::debian::netplan::ethernets:
 "%{lookup('node::interface')}":
    dhcp4: no
    mtu: 9000
profile::platform::baseline::debian::netplan::bridges:
  br0:
    interfaces:
      - "%{lookup('node::interface')}"
    mtu: 9000
    dhcp4: no
    dhcp6: no
    addresses:
      - "%{lookup('node::ip')}/%{lookup('defaults::bits')}"
    #link-local: [ ipv4 ]
    routes:
      - to: "0.0.0.0/0"
        via: "%{lookup('defaults::gateway')}"
      - to: 224.0.0.0/4
        scope: link
    nameservers:
      search: "%{alias('defaults::dns::search')}"
      addresses: "%{alias('defaults::dns::nameservers')}"
    parameters:
      stp: false
      forward_delay: 0

# Config for lxd server
lxd::preseed:
  storage_pools:
    - config:
        source: rpool/lxd
        volatile.initial_source: rpool/lxd
        zfs.pool_name: rpool/lxd
      description: ""
      name: default
      driver: zfs

profile::platform::baseline::debian::zfs::snapshotter::settings:
  rpool/zfspv:
    snap: "no"

profile::app::kopia::maintenance: false
  "/opt":
    - "/appdata/*/logs"
    - "appdata/*/cache"
    - "appdata/*/MediaCover"
