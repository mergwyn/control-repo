profile::app::acme::email: "gary@%{trusted.domain}"
profile::app::acme::domains:
  - "*.%{trusted.domain}"
profile::acme::deploy_hooks:
  minio: 'minio.service'
profile::app::blikvm::domain: "wildcard.%{trusted.domain}"

# container node exporter config
profile::platform::baseline::debian::virtual::lxd::scrape_check_primary: true
profile::platform::baseline::debian::virtual::lxd::scrape_check_exclude:
  - k3s-1
  - k3s-2
  - k3s-3

profile::app::kopia::maintenance: true
profile::app::kopia::snaps:
  - /srv/media/content/christmas
  - /srv/media/content/golf
  - /srv/media/content/home-videos
  - /srv/media/content/music
  - /srv/media/content/radio-shows
  - /srv/media/content/tv/Frasier
  - /srv/public
  - /srv/src

profile::platform::baseline::debian::zfs::snapshotter::settings:
  rpool/zfspv:
    snap: "no"
  srv:
    frequent: 4
    hourly: 24
    daily: 7
    weekly: 4
    monthly: 3
    yearly: 0
    snap: "no"
    clean: "yes"
  rpool/home:
    snap: "yes"
  srv/media:
    monthly: 0
    snap: "yes"
  srv/media/humax:
    snap: "yes"
    monthly: 0
    weekly: 0

# kopia client
profile::app::kopia::backup_files_exclude:
  "/":
    - "/run/k3s/containerd"
    - "/srv/media"
    - "/var/lib/rancher/k3s/agent/containerd"
    - "*.cloudf"
    - "/home/gary/odrive/Amazon Cloud Drive/Pictures"
    - "/media/offsite"
    - "/nfs"
    - "/srv/backup/home-assistant"
