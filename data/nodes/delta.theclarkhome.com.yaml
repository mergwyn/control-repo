---
classes:
  - profile::platform::baseline::debian::netplan

packages:
  - bridge-utils

profile::platform::baseline::debian::netplan::ethernets:
  enp99s0:
    dhcp4: no
    mtu: 9000
profile::platform::baseline::debian::netplan::bridges:
  br0:
    interfaces:
      - enp99s0
    mtu: 9000
    dhcp4: no
    dhcp6: no
    addresses:
      - "%{lookup('defaults::subnet')}.14/%{lookup('defaults::bits')}"
    #link-local: [ ipv4 ]
    routes:
      - to: "0.0.0.0/0"
        via: "%{lookup('defaults::gateway')}"
      - to: 224.0.0.0/4
        scope: link
    nameservers:
      search: "%{alias('defaults::dns::search')}"
      addresses: "%{alias('defaults::dns::nameservers')}"
    parameters:
      stp: false
      forward_delay: 0

# Config for lxd server
lxd::preseed:
  storage_pools:
    - config:
        source: rpool/lxd
        volatile.initial_source: rpool/lxd
        zfs.pool_name: rpool/lxd
      description: ""
      name: default
      driver: zfs

# container node exporter config
profile::platform::baseline::debian::virtual::lxd::scrape_check_primary: true
profile::platform::baseline::debian::virtual::lxd::scrape_check_exclude:
  - k3s-1
  - k3s-2
  - k3s-3

profile::app::kopia::maintenance: true
profile::app::kopia::snaps:
  - /srv/media/content/christmas
  - /srv/media/content/golf
  - /srv/media/content/home-videos
  - /srv/media/content/music
  - /srv/media/content/radio-shows
  - /srv/media/content/tv/Frasier
  - /srv/public
  - /srv/src

profile::platform::baseline::debian::zfs::snapshotter::settings:
  rpool/zfspv:
    snap: "no"
  srv:
    frequent: 4
    hourly: 24
    daily: 7
    weekly: 4
    monthly: 3
    yearly: 0
    snap: "no"
    clean: "yes"
  rpool/home:
    snap: "yes"
  srv/media:
    monthly: 0
    snap: "yes"
  srv/media/humax:
    snap: "yes"
    monthly: 0
    weekly: 0

# kopia client
profile::app::kopia::backup_files_exclude:
  "/":
    - "/run/k3s/containerd"
    - "/srv/media"
    - "/var/lib/rancher/k3s/agent/containerd"
    - "*.cloudf"
    - "/home/gary/odrive/Amazon Cloud Drive/Pictures"
    - "/media/offsite"
    - "/nfs"
    - "/srv/backup/home-assistant"
    - "/srv/media/content/christian"
    - "/srv/media/content/christmas"
    - "/srv/media/content/films"
    - "/srv/media/content/golf"
    - "/srv/media/content/home-videos"
    - "/srv/media/content/music"
    - "/srv/media/content/radio-shows"
    - "/srv/media/content/torrents"
    - "/srv/media/content/tv"
    - "/srv/media/content/usenet"
    - "/srv/media/humax"
    - "/srv/minio"
    - "/srv/timemachine"
    - "/srv/virtual/VirtualBox"
    - "/srv/virtual/vmware"
    - "/var/lib/backuppc"
