---
# environment
defaults::workgroup: "THECLARKHOME"
defaults::realm: "THECLARKHOME.COM"
defaults::puppetmaster: "echo.%{trusted.domain}"

# user
defaults::adminemail: "root@%{trusted.domain}"
defaults::adminuser: "administrator"

# always get latest
vcsrepo::ensure: "latest"

# network
defaults::netmask: "255.255.255.0"
defaults::bits: "24"
defaults::subnet: "10.58.0"
defaults::lan_subnet: "%{lookup('defaults::subnet')}.0/%{lookup('defaults::bits')}"
defaults::network: "%{lookup('defaults::subnet')}.0"
defaults::gateway: "%{lookup('defaults::subnet')}.1"
defaults::cidr: "%{lookup('defaults::network')}/%{lookup('defaults::bits')}"
# DNS
defaults::dns::vip: "%{lookup('defaults::subnet')}.20"
defaults::dns::search:
  - "%{trusted.domain}"
  - local
defaults::dns::nameservers:
  - "%{lookup('defaults::subnet')}.21"
  - "%{lookup('defaults::subnet')}.22"

ntp::allow_subnets:
  - "%{lookup('defaults::network')}/%{lookup('defaults::bits')}"

# VPN settings
defaults::vpn::servers:
  - "%{lookup('defaults::subnet')}.23"  # yankee
  - "%{lookup('defaults::subnet')}.24"  # zulu
defaults::vpn_gateway: "%{lookup('defaults::vpn::servers.1')}"

# K3s settings
defaults::k3s::clusterIP: "10.43.0.10"

defaults::vpn::use_systemd_resolved: true
profile::infrastructure::router::type: "privatvpn"

defaults::backup_server: "delta"
defaults::system_user: "root"
defaults::system_group: "root"
defaults::system_home_dir: "/root"
defaults::media_user: "media"
defaults::media_group: "513"

defaults::zabbix_version: "6.4"
defaults::zabbix_user: "zabbix"
defaults::zabbix_pass: "%{lookup('secrets::zabbix')}"
defaults::zabbix_url: "zulu.%{trusted.domain}"

profile::app::zabbix::agent::enabled: false

# openvox support
puppet::client_package: openvox-agent
puppet::server_package: openvox-server
puppetdb::puppetdb_package: openvoxdb
puppetdb::master::config::terminus_package: openvoxdb-termini

sssd::domains: ["domain/%{rusted.domain}"]
sssd::services: ["nss"]

profile::app::kopia::client::kopiacmd: "/opt/scripts/bin/kopiacmd"

profile::app::k8s_tools::packages:
  - "age"

lookup_options:
  "^classes(.*)$":
    merge: deep
    knockout_prefix: "--"
  sudo::configs:
    merge:
      strategy: deep
      merge_hash_arrays: true
