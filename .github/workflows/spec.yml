name: "Spec Tests"

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited

    branches:
      - 'renovate/**'
  push:
    branches:
      - production

#concurrency:
#  group: ${{ github.head_ref }}
#  cancel-in-progress: true

jobs:
  setup_matrix:
    name: "Setup Test Matrix"
    runs-on: ubuntu-latest
    outputs:
      spec_matrix: ${{ steps.get-matrix.outputs.spec_matrix }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        if: ${{ github.repository_owner == 'mergwyn' }}

      - name: Activate Ruby 3.2
        uses: ruby/setup-ruby@v1
        if: ${{ github.repository_owner == 'mergwyn' }}
        with:
          ruby-version: "3.2.9"
          bundler-cache: true

      - name: Print bundle environment
        if: ${{ github.repository_owner == 'mergwyn' }}
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::
      - name: Run Static & Syntax Tests
        if: ${{ github.repository_owner == 'mergwyn' }}
        run: |
          bundle exec rake validate lint check rubocop

      - name: Setup Spec Test Matrix
        id: get-matrix
        run: |
          if [ '${{ github.repository_owner }}' == 'mergwyn' ]; then
            bundle exec matrix_from_metadata_v3 --platform-exclude 'Darwin-26'
          else
            echo  "::set-output name=spec_matrix::{}"
          fi
  Spec:
    name: "Spec Tests (Puppet: ${{matrix.puppet_version}}, Ruby Ver: ${{matrix.ruby_version}})"
    needs:
      - setup_matrix
    if: ${{ needs.setup_matrix.outputs.spec_matrix != '{}' }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.setup_matrix.outputs.spec_matrix)}}

    env:
      BUILDEVENT_FILE: '../buildevents.txt'
      PUPPET_GEM_VERSION: ${{ matrix.puppet_version }}
      FACTER_GEM_VERSION: 'https://github.com/puppetlabs/facter#main'
      LANG: C.UTF-8

    steps:
      - run: |
          echo "SANITIZED_PUPPET_VERSION=$(echo '${{ matrix.puppet_version }}' | sed 's/~> //g')" >> $GITHUB_ENV

      - run: |
          echo 'puppet_version=${{ env.SANITIZED_PUPPET_VERSION }}' >> $BUILDEVENT_FILE
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: "Activate Ruby ${{ matrix.ruby_version }}"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.ruby_version}}
          bundler-cache: true

      - name: Generate fixtures from Puppetfile
        if: ${{ github.repository_owner == 'mergwyn' }}
        env:
          LANG: en_US.UTF-
          LC_ALL: en_US.UTF-8
          RUBYOPT: "-Eutf-8"
        run: |
          echo Generate .fixtures.yaml from Puppetfile
          scripts/generate-fixtures.rb
          echo Post generate .fixtures.yml
          ls -l .fixtures.yml
          cat .fixtures.yml

      - name: Print bundle environment
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::
      - name: Set UTF-8 Environment
        run: |
          echo "LANG=C.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV

      - name: Stub brew binary for compile tests
        run: |
          sudo mkdir -p /usr/local/bin
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/brew > /dev/null
          sudo chmod +x /usr/local/bin/brew
          sudo chown "$(id -u):$(id -g)" /usr/local/bin/brew   # must NOT be root-owned

      - name: Run parallel_spec tests
        run: |
          bundle exec rake parallel_spec
